# xcodegen の入力。project.pbxproj は生成物なのでリポジトリに入れない。
#
#   brew install xcodegen
#   cd ios/IconDiffusionApp && ./sync-resources.sh && xcodegen && open IconDiffusionApp.xcodeproj
#
# Core AI は iOS 27 以降。Xcode 27 以降でないとビルドできない。
name: IconDiffusionApp
options:
  bundleIdPrefix: com.egoshi
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true

packages:
  IconDiffusionKit:
    path: ../IconDiffusionKit

targets:
  IconDiffusionApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # .aimodel はディレクトリなので folder 参照にする。中身をバラして
      # コピーされるとモデルとして読めなくなる。
      # バンドル直下に Resources/ を置くと codesign のリソース封印が混乱する
      # （macOS の Contents/Resources と紛らわしい）。Models/ にしてある。
      - path: Models
        type: folder
    dependencies:
      - package: IconDiffusionKit
    settings:
      base:
        # CoreAIBackend.swift をビルド対象に入れる。これが無いとスタブのまま
        PRODUCT_BUNDLE_IDENTIFIER: com.egoshi.icondiffusion
        GENERATE_INFOPLIST_FILE: YES
        # 実機インストール用。Ryuichi Egoshi 個人チーム（com.egoshi.* がこの名義）
        DEVELOPMENT_TEAM: 5JD92NU25P
        CODE_SIGN_STYLE: Automatic
        # 端末は縦持ち前提。回転させても意味のある画面ではない
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Icon Diffusion
        # 作ったアイコンを写真アプリへ書き出す（追加のみ）。
        # ここを通らないと、実際に SNS のアイコンに設定できない
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 作ったアイコンを写真に保存します。
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: ICON_DIFFUSION_COREAI
        SWIFT_VERSION: "6.0"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
