# Stage 1〜5 が共有する単一の設定ファイル。
# パスは training/ からの相対で書く（絶対パスも可）。

[model]
# ベースモデルは未決。企画メモの「次のアクション: ベースモデルの選定」参照。
#   - SD1.5 + LCM-LoRA  … 高速化 LoRA の重ね掛けが効き、スタイル LoRA も定番手順が使える（既定）
#   - stabilityai/sd-turbo … 最初から少ステップ。LCM-LoRA 不要だがライセンス条件を確認すること
# 元の runwayml/stable-diffusion-v1-5 は 2024/08 に HF から取り下げ済み。現存するミラーを指す。
base_model = "stable-diffusion-v1-5/stable-diffusion-v1-5"
revision = ""

# 少ステップ化は自作せず既製品を借りる（本プロジェクトの基本方針）
lcm_lora = "latent-consistency/lcm-lora-sdv1-5"

[style]
# 一度決めたら Stage 2〜6 で変えないこと。学習時と生成時で不一致だとスタイルが呼び出せない。
trigger_word = "ICONST"
prompt_template = "an icon in {trigger} style, {subject}, flat, minimal"
fallback_subject = "a simple object"
negative_prompt = "photo, 3d, gradient, shadow, text, watermark, cluttered"

[dataset]
input_dir = "data/raw"
output_dir = "data/processed"
resolution = 512
# 透過 PNG を合成する背景色
background = "#FFFFFF"

[train]
output_dir = "outputs/icon-lora"
rank = 16
learning_rate = 1e-4
max_train_steps = 800
train_batch_size = 1
gradient_accumulation_steps = 1
seed = 42
# MPS では fp16 学習が不安定なことがあるため既定は no。CUDA を借りるなら "fp16"。
mixed_precision = "no"
checkpointing_steps = 200
# 2026-09-13: Min-SNR 重み付け。**被写体が狙った物に見える割合が +8 ポイント**
# （開集合 379 択・SigLIP2 判定・seed 42/7 の対応比較で改善 10 / 悪化 2・p=0.039）。
# バッチ 1 の勾配分散を下げる効果で、15 回の試行で一度も振っていなかった変数
snr_gamma = 5.0
# noise_offset は**採らない**。縁の白さは確かに直る（108 -> 252。学習データは 254）が、
# **Min-SNR の被写体改善を打ち消す**（合わせると 15 対 16 で効果が消えた）。
# 背景は後処理で決定的に抜けるので、ここで直す必要がない
noise_offset = 0.0

[preview]
output_dir = "outputs/preview"
# 2026-09-09 の形の採点で 8 步が 4 步を上回った（b5・96 枚ずつ・seed 42/7 の両方で）。
# 平均 0.399 -> 0.493、合格率 29.2% -> 38.5%、4 枚の最良 0.809 -> 0.868。
# 透過成功率（Trial 11）では 4 步が勝っていたが、あの指標は形を見ていない。
steps = 8
# Mac での質感確認は企画メモどおり 1.2。端末側は 1.0（CFG なし）が既定。
# docs/architecture.md の「CFG を使うか」を参照。
guidance_scale = 1.2
# 2026-08-22 の実測で決めた値。0.4/0.6/0.8/1.0 と 1.0/1.3/1.6/2.0 を振り、
# 1.0 が最良。1.3 以上は被写体が崩れる（焼き付き側）。
style_weight = 1.0
lcm_weight = 1.0
seed = 42
subjects = [
  "a coffee cup",
  "a house key",
  "a calendar",
  "a paper airplane",
  "a light bulb",
  "a shopping bag",
]

[fuse]
output_dir = "outputs/fused"

[export]
output_dir = "outputs/coreai"
# Swift Package にトークナイザ資産と pipeline_config.json を書き出す先
swift_resources_dir = "../ios/IconDiffusionKit/Sources/IconDiffusionKit/Resources"
quantize = "int8"
# int8 に耐えないモジュールをここで外す。実機で測って決めた値であって、勘ではない。
# TextEncoder（CLIP）は埋め込みに大きな外れ値があり、per-channel int8 でも振幅が潰れる。
# 実測: fp32 [-28.05, 33.09] -> int8 [-14.2, 6.8]。これが UNet 全ステップに伝播して絵が壊れる。
# 詳細は docs/architecture.md 6.7 節。
quantize_skip = ["TextEncoder"]
